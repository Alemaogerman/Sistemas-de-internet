version: '3.8'

services:
  # BANCO DE DADOS POSTGRESQL
  db-server:
    build:
      context: ./db-server
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dados_governo
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dados_governo -h 127.0.0.1"]
      interval: 10s
      timeout: 10s
      retries: 30       # Aumentamos o número de tentativas
      start_period: 2m  # MÁGICA: Dá 2 minutos inteiros de "imunidade" enquanto lê os CSVs

  # BACKEND FLASK
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # Injeta a pasta frontend do seu PC para dentro do Docker.
      # Como o backend roda em /app/Backend, o "../frontend" do Flask vai apontar exatamente para cá!
      - ./frontend:/app/frontend
    depends_on:
      db-server:
        condition: service_healthy

volumes:
  db_data:

services:
  # BANCO DE DADOS POSTGRESQL
  db-server:
    build:
      context: .
      dockerfile: ./db-server/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dados_governo
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dados_governo -h 127.0.0.1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 2m

  # BACKEND FLASK
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # Disponibiliza o frontend dentro do container
      - ./frontend:/app/frontend
    depends_on:
      db-server:
        condition: service_healthy

volumes:
  db_data:

